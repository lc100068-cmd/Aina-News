<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,T=10;            // loop length (s) — every motion below is periodic in T
const c=document.getElementById('c'),g=c.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
let L,meta;
// deterministic random
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const motes=[...Array(46)].map(()=>({x:380+rnd()*1520,y0:rnd()*H,k:1+Math.floor(rnd()*2),m:1+Math.floor(rnd()*3),ph:rnd()*6.283,
  tw:1+Math.floor(rnd()*4),r:1.4+rnd()*2.4,amp:8+rnd()*22}));
window.setup=async(m)=>{meta=m;
  L={moon:await load('moon.png'),tower:await load('tower.png'),rice:[]};
  for(let i=1;i<=5;i++)L.rice.push(await load('rice'+i+'.png'));};
const TAU=Math.PI*2;
window.draw=t=>{
  const p=t/T;
  // background plate + soft moonlight
  g.globalCompositeOperation='source-over';
  g.fillStyle='#174D37';g.fillRect(0,0,W,H);
  const pulse=0.5+0.5*Math.sin(TAU*p);
  let rg=g.createRadialGradient(1800,40,120,1800,40,900);
  rg.addColorStop(0,`rgba(232,205,120,${0.16+0.08*pulse})`);rg.addColorStop(0.45,`rgba(232,205,120,${0.05+0.03*pulse})`);rg.addColorStop(1,'rgba(232,205,120,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  // vignette bottom-left for depth
  let vg=g.createRadialGradient(700,560,300,700,560,1400);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,20,10,0.28)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  // moon with breathing glow
  g.save();g.shadowColor=`rgba(245,215,130,${0.45+0.25*pulse})`;g.shadowBlur=60+30*pulse;
  g.drawImage(L.moon,0,0);g.restore();
  // tower + a slow golden shimmer that sweeps across the line art once per loop
  g.drawImage(L.tower,0,0);
  const sweep=((p*1.0)%1);               // 0..1
  const bx=-500+sweep*(W+1200);
  o.clearRect(0,0,W,H);o.globalCompositeOperation='source-over';o.drawImage(L.tower,0,0);
  o.globalCompositeOperation='source-in';
  const lg=o.createLinearGradient(bx-260,0,bx+260,H*0.35);
  lg.addColorStop(0,'rgba(255,240,190,0)');lg.addColorStop(0.5,'rgba(255,244,200,0.95)');lg.addColorStop(1,'rgba(255,240,190,0)');
  o.fillStyle=lg;o.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';g.globalAlpha=0.55;g.drawImage(off,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  // rice swaying from the base, each stalk a little out of phase
  L.rice.forEach((img,i)=>{const pv=meta.rice[i];
    const a=(1.9*Math.sin(TAU*(2*p)+i*0.9)+0.6*Math.sin(TAU*(4*p)+i*1.7))*Math.PI/180;
    g.save();g.translate(pv.px,pv.py);g.rotate(a);g.translate(-pv.px,-pv.py);g.drawImage(img,0,0);g.restore();});
  // drifting golden motes (fireflies / pollen)
  g.globalCompositeOperation='lighter';
  for(const m of motes){
    const y=((m.y0 - p*m.k*(H+80))%(H+80)+(H+80))%(H+80)-40;
    const x=m.x+m.amp*Math.sin(TAU*p*m.m+m.ph);
    const fadeTop=Math.min(1,Math.max(0,(y-60)/320));
    const textZone=(x<1150&&y>240&&y<720)?0.35:1;
    const a=(0.25+0.75*(0.5+0.5*Math.sin(TAU*p*m.tw+m.ph)))*fadeTop*textZone;
    const rr=g.createRadialGradient(x,y,0,x,y,m.r*5);
    rr.addColorStop(0,`rgba(255,232,150,${0.9*a})`);rr.addColorStop(0.25,`rgba(240,200,100,${0.45*a})`);rr.addColorStop(1,'rgba(240,200,100,0)');
    g.fillStyle=rr;g.beginPath();g.arc(x,y,m.r*5,0,TAU);g.fill();
  }
  g.globalCompositeOperation='source-over';
};
</script></body></html>
